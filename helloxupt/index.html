<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>致 陈金泽 — 后会有期</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', 'Inter', sans-serif;
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, #0c0b1a 0%, #1a1040 30%, #2d1b69 60%, #1a1040 100%);
}

/* 粒子画布 */
#particles-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* 渐变光晕 */
.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}
.glow-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(147, 51, 234, 0.2), transparent);
  top: -200px; right: -200px;
  animation: glowFloat1 12s ease-in-out infinite;
}
.glow-2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(236, 72, 153, 0.15), transparent);
  bottom: -150px; left: -150px;
  animation: glowFloat2 15s ease-in-out infinite;
}
.glow-3 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.1), transparent);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: glowFloat3 18s ease-in-out infinite;
}

@keyframes glowFloat1 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-80px, 80px); }
}
@keyframes glowFloat2 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(60px, -60px); }
}
@keyframes glowFloat3 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
}

/* 主内容 */
.hero {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 60px 40px;
  max-width: 800px;
  width: 90%;
}

.hero-inner {
  position: relative;
}

/* 顶部装饰线 */
.divider-top {
  width: 120px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(147, 51, 234, 0.6), transparent);
  margin: 0 auto 50px;
  animation: fadeSlideDown 1.8s ease-out forwards;
}

/* 中文标题 */
.cn-title {
  font-size: clamp(3rem, 8vw, 6rem);
  font-weight: 900;
  background: linear-gradient(135deg, #e0d5ff, #a78bfa, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0;
  animation: fadeUp 1.2s ease-out 0.3s forwards;
  line-height: 1.2;
  letter-spacing: 0.08em;
}

/* 中文副标题 */
.cn-sub {
  font-size: clamp(1.2rem, 3vw, 2rem);
  font-weight: 400;
  color: rgba(216, 180, 254, 0.8);
  margin-top: 16px;
  opacity: 0;
  animation: fadeUp 1.2s ease-out 0.6s forwards;
  letter-spacing: 0.15em;
}

/* 英文消息 */
.en-message {
  font-family: 'Inter', sans-serif;
  font-size: clamp(1rem, 2vw, 1.25rem);
  font-weight: 300;
  color: rgba(196, 181, 253, 0.6);
  margin-top: 50px;
  line-height: 1.8;
  opacity: 0;
  animation: fadeUp 1.2s ease-out 0.9s forwards;
  letter-spacing: 0.05em;
}

.en-message span {
  display: block;
}

/* 中文正文 */
.cn-body {
  font-size: clamp(1rem, 2.2vw, 1.3rem);
  color: rgba(221, 214, 254, 0.7);
  margin-top: 40px;
  line-height: 2;
  opacity: 0;
  animation: fadeUp 1.2s ease-out 1.2s forwards;
  letter-spacing: 0.05em;
}

.cn-body p {
  margin-bottom: 8px;
}

/* 署名 */
.signature {
  margin-top: 60px;
  opacity: 0;
  animation: fadeUp 1.2s ease-out 1.8s forwards;
}

.signature-line {
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(147, 51, 234, 0.5));
  margin: 0 auto 16px;
}

.signature-name {
  font-size: clamp(1.2rem, 2.5vw, 1.6rem);
  font-weight: 700;
  color: rgba(196, 181, 253, 0.9);
  letter-spacing: 0.2em;
}

.signature-date {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 300;
  color: rgba(148, 139, 204, 0.4);
  margin-top: 8px;
  letter-spacing: 0.1em;
}

/* 底部装饰线 */
.divider-bottom {
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(147, 51, 234, 0.4), transparent);
  margin: 40px auto 0;
  opacity: 0;
  animation: fadeSlideDown 1.2s ease-out 2.2s forwards;
}

/* 流星 */
.shooting-star {
  position: fixed;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
}
.shooting-star::before {
  content: '';
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.6), transparent);
  right: 100%;
}

/* 底部提示 */
.scroll-hint {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;
  animation: fadeIn 1s ease-out 3s forwards;
}

.scroll-hint span {
  font-family: 'Inter', sans-serif;
  font-size: 0.75rem;
  color: rgba(148, 139, 204, 0.3);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.scroll-hint .arrow {
  animation: bounce 2s ease-in-out infinite;
}

.scroll-hint .arrow svg {
  width: 16px;
  height: 16px;
  stroke: rgba(148, 139, 204, 0.3);
  fill: none;
  stroke-width: 2;
}

/* 关键帧 */
@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes fadeSlideDown {
  0% { opacity: 0; transform: scaleX(0); }
  100% { opacity: 1; transform: scaleX(1); }
}

@keyframes fadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

/* 响应式 */
@media (max-width: 600px) {
  .hero { padding: 40px 24px; }
  .en-message { margin-top: 36px; }
  .cn-body { margin-top: 28px; }
}
</style>
</head>
<body>

<!-- 光晕 -->
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<!-- 粒子画布 -->
<canvas id="particles-canvas"></canvas>

<!-- 流星 -->
<div class="shooting-star" id="shooting-star"></div>

<!-- 主内容 -->
<div class="hero">
  <div class="hero-inner">
    <div class="divider-top"></div>
    <h1 class="cn-title">后会有期</h1>
    <p class="cn-sub">陈金泽</p>

    <div class="en-message">
      <span>Farewell is not the end, but a new beginning.</span>
      <span>May our paths cross again under brighter skies.</span>
    </div>

    <div class="cn-body">
      <p>山水有相逢，来日皆可期。</p>
      <p>愿此去星辰大海，前程锦绣如画。</p>
      <p>感谢一路相伴，江湖再见。</p>
    </div>

    <div class="signature">
      <div class="signature-line"></div>
      <p class="signature-name">珍重 · 再会</p>
      <p class="signature-date">2026 · 夏</p>
    </div>

    <div class="divider-bottom"></div>
  </div>
</div>

<div class="scroll-hint">
  <span>Farewell</span>
  <div class="arrow">
    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
</div>

<script>
// ---- 粒子系统 ----
(function() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;
  let mouse = { x: -9999, y: -9999 };

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COUNT = 80;

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.size = Math.random() * 3 + 1;
      this.speedX = (Math.random() - 0.5) * 0.5;
      this.speedY = (Math.random() - 0.5) * 0.5;
      this.opacity = Math.random() * 0.5 + 0.1;
      this.pulse = Math.random() * Math.PI * 2;
      this.pulseSpeed = 0.005 + Math.random() * 0.01;
      this.color = Math.random() > 0.5
        ? `rgba(147, 51, 234, `   // 紫色
        : `rgba(236, 72, 153, `;  // 粉色
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.pulse += this.pulseSpeed;

      // 鼠标互动
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        const force = (150 - dist) / 150;
        this.x += dx * force * 0.02;
        this.y += dy * force * 0.02;
      }

      // 边界回弹
      if (this.x < 0 || this.x > w) this.speedX *= -1;
      if (this.y < 0 || this.y > h) this.speedY *= -1;

      // 边界内约束
      this.x = Math.max(0, Math.min(w, this.x));
      this.y = Math.max(0, Math.min(h, this.y));
    }
    draw() {
      const o = this.opacity * (0.7 + 0.3 * Math.sin(this.pulse));
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color + o + ')';
      ctx.fill();
    }
  }

  for (let i = 0; i < COUNT; i++) {
    particles.push(new Particle());
  }

  // 连线
  function drawLines() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 160) {
          const o = (1 - dist / 160) * 0.12;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(147, 51, 234, ${o})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => { p.update(); p.draw(); });
    drawLines();
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
  }, { passive: true });
})();

// ---- 流星 ----
(function() {
  const star = document.getElementById('shooting-star');
  let active = false;

  function shoot() {
    if (active) return;
    active = true;

    const x = Math.random() * window.innerWidth * 0.8;
    const y = Math.random() * window.innerHeight * 0.4;
    const angle = -30 + Math.random() * 20 - 10;
    const rad = (angle * Math.PI) / 180;
    const dist = 200 + Math.random() * 150;

    star.style.left = x + 'px';
    star.style.top = y + 'px';
    star.style.opacity = '1';
    star.style.transform = `rotate(${angle}deg)`;
    star.style.transition = 'none';

    star.offsetHeight;
    star.style.transition = `all ${0.6 + Math.random() * 0.4}s linear`;
    star.style.left = (x + Math.cos(rad) * dist) + 'px';
    star.style.top = (y + Math.sin(rad) * dist) + 'px';
    star.style.opacity = '0';

    setTimeout(() => {
      active = false;
      star.style.opacity = '0';
    }, 1200);
  }

  function schedule() {
    const delay = 2000 + Math.random() * 6000;
    setTimeout(() => {
      shoot();
      schedule();
    }, delay);
  }
  schedule();
  setTimeout(shoot, 500);
})();
</script>
</body>
</html>
